<main class="login">
  <form class="card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>VCK Admin</h1>
    <p class="muted">Sign in to manage the website's content.</p>
    @if (error()) {
      <p class="alert" role="alert">{{ error() }}</p>
    }
    <label>
      Email
      <input type="email" formControlName="email" autocomplete="username" autofocus />
    </label>
    <label>
      Password
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>
    <button class="btn primary" type="submit" [disabled]="busy()">{{ busy() ? 'Signing in…' : 'Sign in' }}</button>
  </form>
</main>
