<section #sectionRoot class="ideology-section" [attr.lang]="language" [attr.aria-label]="language === 'ta' ? 'விசிகவின் ஐந்து கொள்கைகள்' : 'Five VCK principles'">
  <div class="ideology-stage">
    <div class="star-column">
      <div class="star-wrap">
        <svg #ideologyStar class="ideology-star" viewBox="0 0 100 100" role="group"
          [attr.aria-label]="language === 'ta' ? 'ஐந்து கொள்கைகளைக் குறிக்கும் ஐந்து முனை நட்சத்திரம்' : 'Interactive five-point star representing the five principles'">
          <defs>
            <filter id="ideology-star-glow" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="3" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>
          @for (point of points; track point.key; let i = $index) {
            <g class="star-point" [class.is-active]="activeIndex() === i" role="button" tabindex="0"
              [attr.aria-label]="principles[i].title"
              [attr.aria-pressed]="activeIndex() === i"
              (click)="selectPrinciple(i)"
              (keydown)="onPointKeydown($event, i)">
              <path class="star-point-face" [attr.d]="point.path" />
            </g>
          }
          <path class="star-contour" d="M50 4 L61.5 36 L96 37 L68 58 L78 92 L50 73 L22 92 L32 58 L4 37 L38.5 36 Z" />
          @for (point of points; track point.key) {
            <path class="star-connection" [attr.d]="point.connectionPath" pathLength="1" />
          }
          @for (point of points; track point.key) {
            <circle class="star-traveler" cx="50" cy="50" r="1.6" />
          }
          <circle class="star-core" cx="50" cy="50" r="2.2" />
        </svg>
        <span class="star-aura" aria-hidden="true"></span>
      </div>
    </div>

    <div class="principle-panel">
      <p class="ideology-eyebrow">{{ language === 'ta' ? 'ஒரு நட்சத்திரம் · ஐந்து கொள்கைகள்' : 'ONE STAR · FIVE PRINCIPLES' }}</p>
      <div class="principle-window" aria-live="polite">
        @for (principle of principles; track principle.key; let i = $index) {
          <article class="principle-card" [class.is-active]="activeIndex() === i" [attr.aria-hidden]="activeIndex() !== i">
            <p class="principle-index">0{{ i + 1 }} / 05</p>
            <h2>{{ principle.title }}</h2>
            <p class="principle-description">{{ principle.description }}</p>
          </article>
        }
      </div>

      <nav class="principle-navigation" [attr.aria-label]="language === 'ta' ? 'கொள்கை வழிசெலுத்தல்' : 'Principle navigation'">
        <button class="principle-step" type="button" (click)="selectPrinciple(activeIndex() - 1)"
          [disabled]="activeIndex() === 0" [attr.aria-label]="language === 'ta' ? 'முந்தைய கொள்கை' : 'Previous principle'">
          <span aria-hidden="true">←</span>
        </button>
        <div class="principle-indicators">
          @for (point of points; track point.key; let i = $index) {
            <button type="button" class="principle-indicator" [class.is-active]="activeIndex() === i"
              [attr.aria-current]="activeIndex() === i ? 'step' : null"
              [attr.aria-label]="principles[i].title"
              (click)="selectPrinciple(i)">
              <span>0{{ i + 1 }}</span>
            </button>
          }
        </div>
        <button class="principle-step" type="button" (click)="selectPrinciple(activeIndex() + 1)"
          [disabled]="activeIndex() === points.length - 1" [attr.aria-label]="language === 'ta' ? 'அடுத்த கொள்கை' : 'Next principle'">
          <span aria-hidden="true">→</span>
        </button>
      </nav>
      <div class="principle-progress" aria-hidden="true"><span></span></div>
    </div>
  </div>

  <div #transitionStar class="star-transition" aria-hidden="true">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none">
      <polygon points="50,4 61,36 96,37 68,58 78,92 50,73 22,92 32,58 4,37 39,36" />
    </svg>
  </div>
</section>
