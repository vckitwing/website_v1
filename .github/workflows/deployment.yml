
name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        id: build
        run: |
          npm run build -- --configuration production --base-href /website_v1/

          DIST_DIR=$(find dist -name index.html -printf '%h\n' | head -n 1)

          if [ -z "$DIST_DIR" ]; then
            echo "Angular build output index.html not found"
            exit 1
          fi

          echo "path=$DIST_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.build.outputs.path }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
