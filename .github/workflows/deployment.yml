
name: Deploy VCK Angular Website

on:
  push:
    branches:
      - main
      - feature/dev_landing_page
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Angular
        working-directory: frontend
        run: >
          npx ng build vck-website
          --configuration production
          --base-href /website_v1/

      - name: Write robots.txt, sitemap.xml and 404.html
        working-directory: frontend
        run: node tools/seo-files.mjs

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist/vck-website/browser

  deploy:
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
